# Configuración para Netlify (sitio estático, sin build)
[build]
  publish = "."

# HTML siempre fresco; CSS/JS cacheados (se refrescan con ?v=FECHA)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# El panel no debe aparecer en Google
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
