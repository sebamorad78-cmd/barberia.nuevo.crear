<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarjeta personal · Sebastian Morad</title>
<style>
  @font-face { font-family: "Fraunces"; src: url(../flyer/fonts/fraunces-latin-300-normal.woff2) format("woff2"); font-weight: 300; }
  @font-face { font-family: "Fraunces"; src: url(../flyer/fonts/fraunces-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Fraunces"; src: url(../flyer/fonts/fraunces-latin-300-italic.woff2) format("woff2"); font-weight: 300; font-style: italic; }
  @font-face { font-family: "Fraunces"; src: url(../flyer/fonts/fraunces-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "Manrope"; src: url(../flyer/fonts/manrope-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Manrope"; src: url(../flyer/fonts/manrope-latin-700-normal.woff2) format("woff2"); font-weight: 700; }

  :root { --ink: #0e0d0b; --paper: #f1ebe0; --muted: #a69c8c; --brass: #c9a45c; --line: rgba(241, 235, 224, .18);
    --w: 90mm; --h: 50mm; --bleed: 0mm; --m: 5mm; }
  @page { margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2a2824; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .card { position: relative; width: calc(var(--w) + 2 * var(--bleed)); height: calc(var(--h) + 2 * var(--bleed)); padding: calc(var(--bleed) + var(--m));
    background: radial-gradient(45mm 40mm at 108% 0%, rgba(201, 164, 92, .18), transparent 70%), var(--ink);
    color: var(--paper); font-family: "Manrope", sans-serif; overflow: hidden; break-after: page; }

  /* Frente */
  .front { display: flex; flex-direction: column; justify-content: space-between; }
  .name { font-family: "Fraunces", serif; font-weight: 400; font-size: 5.4mm; letter-spacing: -.01em; line-height: 1; }
  .role { margin-top: 1.6mm; font-family: "Fraunces", serif; font-style: italic; font-weight: 300; font-size: 3.3mm; color: var(--brass); }
  .rubros { margin-top: 2mm; font-size: 1.75mm; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .data { display: grid; grid-template-columns: auto 1fr; column-gap: 3mm; row-gap: 1.1mm; padding-top: 2.6mm; border-top: .2mm solid var(--line); font-size: 2.45mm; font-weight: 500; }
  .data dt { font-size: 1.7mm; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--brass); line-height: 2.45mm; }
  .data dd { letter-spacing: .01em; }

  /* Dorso */
  .back { display: grid; grid-template-columns: 26mm 1fr; gap: 5mm; align-items: center; }
  .qr { width: 26mm; height: 26mm; padding: 2.2mm; background: var(--paper); border-radius: 1mm; }
  .qr img { display: block; width: 100%; height: 100%; }
  .cta { font-family: "Fraunces", serif; font-weight: 300; font-size: 4.6mm; line-height: 1.12; letter-spacing: -.01em; }
  .cta em { display: block; color: var(--brass); font-style: italic; }
  .url { margin-top: 2.4mm; font-size: 1.95mm; color: var(--muted); letter-spacing: .01em; }
  .tags { margin-top: 2.4mm; padding-top: 2.2mm; border-top: .2mm solid var(--line); font-size: 1.75mm; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(241, 235, 224, .8); line-height: 1.6; }
</style>
</head>
<body>
  <section class="card front">
    <div>
      <p class="name">Sebastian Morad</p>
      <p class="role">Webs con turnos online</p>
      <p class="rubros">Barberías · Salones · Spas · Nail bars</p>
    </div>
    <dl class="data">
      <dt>WhatsApp</dt><dd>2268 51-6801</dd>
      <dt>Email</dt><dd>sebamorad46@gmail.com</dd>
      <dt>Zona</dt><dd>Mar del Plata · atención en persona</dd>
    </dl>
  </section>
  <section class="card back">
    <div class="qr"><img src="../flyer/qr.svg" alt="Código QR a la demo"></div>
    <div>
      <p class="cta">Escaneá y <em>probá la demo.</em></p>
      <p class="url">paginas-profesionales-1212.netlify.app</p>
      <p class="tags">Reservas 24/7 · Sin comisión<br>Sin permanencia</p>
    </div>
  </section>
<script>
  // ?bleed=1 → versión imprenta (+3 mm por lado, 96 x 56 mm)
  if (new URLSearchParams(location.search).get("bleed") === "1") document.documentElement.style.setProperty("--bleed", "3mm");
</script>
</body>
</html>
